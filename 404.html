  <script>
    // GitHub Pages serves this file for every missing path. A NEWS page that has not been generated
    // yet (a scheduled post that just went live, or a post published minutes ago) opens in the live
    // NEWS viewer instead, which reads data/news.json directly.
    (function () {
      var m = location.pathname.match(/^(\/(?:.*\/)?)news\/([A-Za-z0-9][A-Za-z0-9._-]{0,199})\/?(?:index\.html)?$/);
      if (m) location.replace(m[1] + 'news/?id=' + encodeURIComponent(m[2]) + location.hash);
    })();
  </script>
