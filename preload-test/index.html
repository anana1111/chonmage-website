<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHONMAGE Preload Test</title>
<style>
:root{
  --bg:#f7f4ee;
  --ink:#111;
  --red:#ed1c24;
  --muted:rgba(17,17,17,.16);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg)}
body{overflow:hidden;font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.stage{
  position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(circle at 50% 44%,rgba(237,28,36,.055),transparent 34%),
    linear-gradient(180deg,#faf8f3 0%,#f7f4ee 100%);
}
.preloader{
  position:relative;
  width:min(88vw,520px);
  height:min(72vh,520px);
  display:grid;
  place-items:center;
}
.logo-wrap{
  position:relative;
  width:min(86vw,470px);
  transform:translateY(18px) scale(.93);
  opacity:0;
  animation:logo-in .9s cubic-bezier(.16,1,.3,1) .12s forwards;
}
.logo{
  width:100%;height:auto;display:block;
  filter:drop-shadow(0 18px 24px rgba(0,0,0,.07));
  user-select:none;-webkit-user-drag:none;
}
.finger-spark{
  position:absolute;
  left:14.3%;
  top:4.4%;
  width:18px;height:18px;
  transform:rotate(45deg) scale(0);
  background:var(--red);
  border-radius:2px;
  opacity:0;
  animation:spark-pop .45s cubic-bezier(.2,1.7,.3,1) .85s forwards;
}
.finger-spark:before{
  content:"";
  position:absolute;inset:-10px;
  border:1px solid rgba(237,28,36,.28);
  border-radius:50%;
  transform:rotate(-45deg) scale(.25);
  opacity:0;
  animation:ring 1.2s ease-out 1.05s 2;
}
.suit{
  position:absolute;
  left:14.6%;
  top:4.8%;
  font-family:Georgia,serif;
  font-weight:700;
  font-size:26px;
  line-height:1;
  opacity:0;
  transform:translate(-50%,-50%) scale(.3) rotate(0deg);
  color:var(--ink);
}
.suit.red{color:var(--red)}
.s1{animation:fly1 1.15s cubic-bezier(.18,.75,.24,1) 1.1s forwards}
.s2{animation:fly2 1.15s cubic-bezier(.18,.75,.24,1) 1.18s forwards}
.s3{animation:fly3 1.15s cubic-bezier(.18,.75,.24,1) 1.26s forwards}
.s4{animation:fly4 1.15s cubic-bezier(.18,.75,.24,1) 1.34s forwards}
.brand{
  position:absolute;
  left:50%;bottom:11%;
  transform:translateX(-50%) translateY(8px);
  text-align:center;opacity:0;
  animation:brand-in .5s ease 1.35s forwards;
}
.brand-name{
  font-size:12px;font-weight:800;letter-spacing:.38em;text-indent:.38em;
}
.track{
  width:180px;height:2px;border-radius:999px;background:var(--muted);
  margin:14px auto 0;overflow:hidden;
}
.bar{
  height:100%;width:100%;background:var(--red);
  transform-origin:left;transform:scaleX(0);
  animation:load 1.7s cubic-bezier(.4,0,.15,1) 1.15s forwards;
}
.exit-wipe{
  position:fixed;inset:0;background:var(--red);
  transform:translateY(101%);
  animation:wipe 1.1s cubic-bezier(.77,0,.18,1) 2.72s forwards;
  pointer-events:none;
}
.final-mark{
  position:fixed;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(.7);
  color:#fff;font-family:Georgia,serif;font-size:54px;font-weight:700;
  opacity:0;z-index:2;
  animation:final .7s cubic-bezier(.2,1.3,.3,1) 3.12s forwards;
}
.replay{
  position:fixed;right:16px;bottom:16px;z-index:3;
  border:1px solid rgba(17,17,17,.14);
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(8px);
  border-radius:999px;
  padding:10px 14px;
  font:700 11px/1 Arial,sans-serif;
  letter-spacing:.12em;
  color:#111;
  opacity:0;
  animation:show-replay .25s ease 4s forwards;
}
@keyframes logo-in{
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes spark-pop{
  0%{opacity:0;transform:rotate(45deg) scale(.15)}
  70%{opacity:1;transform:rotate(45deg) scale(1.22)}
  100%{opacity:1;transform:rotate(45deg) scale(1)}
}
@keyframes ring{
  0%{opacity:.7;transform:rotate(-45deg) scale(.2)}
  100%{opacity:0;transform:rotate(-45deg) scale(1.5)}
}
@keyframes fly1{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-15deg)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(-125px,-95px) scale(1.1) rotate(-38deg)}
}
@keyframes fly2{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(10deg)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(-42px,-138px) scale(.95) rotate(24deg)}
}
@keyframes fly3{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(45px,-118px) scale(1.05) rotate(-12deg)}
}
@keyframes fly4{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(12deg)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(116px,-70px) scale(.9) rotate(34deg)}
}
@keyframes brand-in{to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes load{to{transform:scaleX(1)}}
@keyframes wipe{
  0%{transform:translateY(101%)}
  50%{transform:translateY(0)}
  100%{transform:translateY(0)}
}
@keyframes final{
  from{opacity:0;transform:translate(-50%,-50%) scale(.55) rotate(-10deg)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
}
@keyframes show-replay{to{opacity:.72}}
@media(max-width:560px){
  .preloader{height:68vh}
  .logo-wrap{width:min(96vw,430px)}
  .brand{bottom:5%}
  .track{width:150px}
  .suit{font-size:23px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<main class="stage">
  <section class="preloader" aria-label="CHONMAGE preload animation">
    <div class="logo-wrap">
      <img class="logo" src="/_originals/images/chonmage-character.png" alt="CHONMAGE">
      <span class="finger-spark" aria-hidden="true"></span>
      <span class="suit s1">♠</span>
      <span class="suit s2 red">♥</span>
      <span class="suit s3">♣</span>
      <span class="suit s4 red">♦</span>
    </div>
    <div class="brand">
      <div class="brand-name">CHONMAGE</div>
      <div class="track"><div class="bar"></div></div>
    </div>
  </section>
</main>
<div class="exit-wipe"></div>
<div class="final-mark">♦</div>
<button class="replay" onclick="location.reload()">REPLAY</button>
</body>
</html>
