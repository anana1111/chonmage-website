<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHONMAGE Preloader Preview</title>
<style>
:root{--paper:#faf7f1;--ink:#111;--red:#f01e2f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper)}
body{font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,rgba(240,30,47,.055),transparent 32%),var(--paper)}
.loader{width:min(92vw,560px);display:grid;justify-items:center;gap:10px}
.art{position:relative;width:min(90vw,500px);opacity:0;transform:translateY(18px) scale(.94);animation:enter .75s cubic-bezier(.16,1,.3,1) forwards}
.art img{display:block;width:100%;height:auto;filter:drop-shadow(0 16px 20px rgba(0,0,0,.06))}
.spark{position:absolute;left:9.8%;top:5.5%;width:14px;height:14px;background:var(--red);transform:rotate(45deg) scale(0);border-radius:2px;opacity:0;animation:spark .45s cubic-bezier(.2,1.7,.3,1) .7s forwards}
.spark:after{content:"";position:absolute;inset:-9px;border:1px solid rgba(240,30,47,.30);border-radius:50%;transform:rotate(-45deg) scale(.2);opacity:0;animation:ring 1.2s ease-out .9s 2}
.copy{text-align:center;opacity:0;animation:fade .4s ease .9s forwards}
.brand{font-size:12px;font-weight:800;letter-spacing:.34em;text-indent:.34em}
.track{width:180px;height:2px;background:rgba(17,17,17,.14);border-radius:99px;overflow:hidden;margin:13px auto 0}
.bar{height:100%;background:var(--red);transform:scaleX(0);transform-origin:left;animation:load 2s cubic-bezier(.4,0,.15,1) .75s forwards}
.status{margin-top:9px;font-size:10px;letter-spacing:.12em;color:rgba(17,17,17,.52)}
.loader.out{animation:out .55s ease forwards}
.replay{position:fixed;right:16px;bottom:16px;border:1px solid rgba(17,17,17,.14);background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-radius:999px;padding:10px 14px;font:700 11px/1 Arial,sans-serif;letter-spacing:.1em;color:#111}
@keyframes enter{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes spark{0%{opacity:0;transform:rotate(45deg) scale(.1)}70%{opacity:1;transform:rotate(45deg) scale(1.2)}100%{opacity:1;transform:rotate(45deg) scale(1)}}
@keyframes ring{0%{opacity:.75;transform:rotate(-45deg) scale(.2)}100%{opacity:0;transform:rotate(-45deg) scale(1.5)}}
@keyframes load{to{transform:scaleX(1)}}
@keyframes out{to{opacity:0;transform:translateY(-8px) scale(.985)}}
@media(max-width:520px){.art{width:min(96vw,460px)}.track{width:155px}.brand{font-size:11px}}
</style>
</head>
