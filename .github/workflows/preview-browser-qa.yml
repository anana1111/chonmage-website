name: Preview browser QA

on:
  push:
    branches:
      - schedule-upgrade-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright for QA only
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static preview
        run: |
          python3 -m http.server 8125 --bind 127.0.0.1 > /tmp/chonmage-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8125/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chonmage-http.log
          exit 1

      - name: Run real Chromium smoke tests
        run: node scripts/browser-smoke.mjs
