name: Update daily events

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'news-core.js'
      - 'publish-core.js'
      - 'data/events.manual.json'
      - 'data/week.json'
      - '.github/workflows/update-events.yml'
  schedule:
    # Cron is UTC (JST = UTC+9). Minutes are offset from :00 to avoid the busiest slot.
    # Every day: JST 09:07 / 12:07 / 13:07 / 15:07
    - cron: '7 0,3,4,6 * * *'
    # Weekdays: daily posts appear around the 17:00 OPEN -> JST 16:17 – 19:47 every 30 min
    - cron: '17,47 7-10 * * 1-5'
    # Weekends: 13:00 OPEN -> JST 11:17 – 13:47 every 30 min
    - cron: '17,47 2-4 * * 0,6'
  workflow_dispatch:
    inputs:
      reread_week:
        description: 'Read the latest week schedule picture again'
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: update-daily-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test schedule data logic
        run: node scripts/test-schedule.mjs

      - name: Test NEWS rules and snapshot merge
        run: node scripts/test-news.mjs

      # Reads the shop's posts as a separate small X account (repository secrets X_AUTH_TOKEN and
      # X_CT0) with twitter-cli, pinned. Without the secrets, or on failure, the logged-out sources run.
      - name: Read official X posts with the logged-in account
        continue-on-error: true
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.X_CT0 }}
        run: |
          if [ -z "$TWITTER_AUTH_TOKEN" ] || [ -z "$TWITTER_CT0" ]; then echo "No X login secrets; skipping."; exit 0; fi
          python3 -m pip install --quiet --disable-pip-version-check twitter-cli==0.8.5
          if ! twitter user-posts ChonmageNiigata --max 20 --json > "$RUNNER_TEMP/x-posts.json"; then
            head -c 400 "$RUNNER_TEMP/x-posts.json" >&2; rm -f "$RUNNER_TEMP/x-posts.json"; exit 1
          fi
          node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log('logged-in X read: ok=' + d.ok + ', posts=' + (Array.isArray(d.data) ? d.data.length : 0))" "$RUNNER_TEMP/x-posts.json"
          # The Sunday week picture can be pinned or edited and then missing from the timeline above.
          twitter search "スケジュール" --from ChonmageNiigata --type Latest --has images --max 5 --json > "$RUNNER_TEMP/x-week-posts.json" || rm -f "$RUNNER_TEMP/x-week-posts.json"

      # The Sunday week picture is read once by GitHub Models (free with GITHUB_TOKEN).
      # A failure only warns: the old week.json and the daily OPEN posts still work.
      - name: Read the week schedule picture
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_POSTS_PATH: ${{ runner.temp }}/x-posts.json
          X_WEEK_POSTS_PATH: ${{ runner.temp }}/x-week-posts.json
          WEEK_CHANGED_PATH: ${{ runner.temp }}/week-changed
          REREAD_WEEK: ${{ inputs.reread_week }}
        run: node scripts/read-week-image.mjs || echo "::warning::The week schedule picture was not read; keeping data/week.json."

      - name: Fetch official X schedule and NEWS when publicly available
        env:
          NEWS_CANDIDATES_PATH: ${{ runner.temp }}/chonmage-news-candidates.json
          X_POSTS_PATH: ${{ runner.temp }}/x-posts.json
        run: node scripts/fetch-events.mjs

      # Downloads the X photos of current NEWS once; the commit step below reuses these files.
      - name: Copy NEWS photos from X into the site
        run: |
          node scripts/sync-news.mjs "$RUNNER_TEMP/chonmage-news-candidates.json"
          node scripts/news-images.mjs data/news.json || echo "::warning::NEWS photos were not copied; the X links stay."

      - name: Merge manual overrides over automatic data
        run: node scripts/merge-events.mjs

      - name: Validate final public schedule
        run: node scripts/validate-events.mjs data/events.json data/news.json

      - name: Commit only real data changes
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTO_TMP="$(mktemp)"
          cp data/events.auto.json "$AUTO_TMP"
          WEEK_TMP="$(mktemp)"
          cp data/week.json "$WEEK_TMP"
          DATE="$(node -e "const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));process.stdout.write(o.year+'-'+o.month+'-'+o.day)")"
          for attempt in 1 2 3; do
            # main may have changed while this job ran (e.g. staff uploaded events.manual.json).
            # Start from the latest main, keep only this run's auto data, and merge again so
            # the newest manual overrides and NEWS edits are never overwritten.
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp "$AUTO_TMP" data/events.auto.json
            if [ -f "$RUNNER_TEMP/week-changed" ]; then cp "$WEEK_TMP" data/week.json; fi
            node scripts/merge-events.mjs
            node scripts/sync-news.mjs "$RUNNER_TEMP/chonmage-news-candidates.json"
            # A photo problem must never block the schedule update, so it only warns.
            node scripts/news-images.mjs data/news.json || echo "::warning::NEWS photos were not copied; the X links stay."
            node scripts/validate-events.mjs data/events.json data/news.json
            if git diff --quiet -- data/events.auto.json data/events.json data/news.json data/week.json; then
              echo "No schedule or NEWS data changes."
              exit 0
            fi
            git add data/events.auto.json data/events.json data/news.json data/week.json
            if [ -d images/news ]; then git add images/news; fi
            git commit --quiet -m "Update daily events and NEWS for $DATE"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (main moved); retrying ($attempt/3)."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push schedule data after 3 attempts."
          exit 1
