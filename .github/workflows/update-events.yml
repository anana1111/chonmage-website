name: Update daily events

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/update-events.yml'
  schedule:
    - cron: '0 0,3,6,8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-daily-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test schedule data logic
        run: node scripts/test-schedule.mjs

      - name: Fetch official X schedule when publicly available
        run: node scripts/fetch-events.mjs

      - name: Merge manual overrides over automatic data
        run: node scripts/merge-events.mjs

      - name: Validate final public schedule
        run: node scripts/validate-events.mjs data/events.json

      - name: Commit only real data changes
        shell: bash
        run: |
          if git diff --quiet -- data/events.auto.json data/events.json; then
            echo "No schedule data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE="$(node -e "const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));process.stdout.write(o.year+'-'+o.month+'-'+o.day)")"
          git add data/events.auto.json data/events.json
          git commit -m "Update daily events for $DATE"
          git push
