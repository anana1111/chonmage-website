# One-off on the KING preview branch (F approved in the project thread): collect the KING result
# posts F linked, and their pictures, from X so /king/ can show real winners.
# Uses the same burner account as update-events.yml. Delete this file before merging.
name: Fetch KING posts from X (one-off)
on:
  push:
    branches: [claude/project-thread-qyxssn]
    paths: [.github/workflows/king-x-fetch.yml]
permissions:
  contents: write
concurrency: king-x-fetch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read the KING result posts F linked, with their pictures
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.X_CT0 }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check twitter-cli==0.8.5
          python3 - <<'PY'
          # Post ids F sent in the project thread (all on @Old_Chonmage).
          import json, os, urllib.request
          from twitter_cli.cli import _get_client
          from twitter_cli.serialization import tweets_to_data
          ids = ['1988601356865995055', '1998389669487431926', '2015784192404275551', '2020831944284762201',
                 '2041507153987641368', '2057077865443991823', '2071234288612442249', '2075930590160073038',
                 '2091525465085505844', '2099121808758956055']
          out = '_originals/king-x'; os.makedirs(out + '/images', exist_ok=True)
          client = _get_client(quiet=True)
          found = []
          for i in ids:
              try:
                  rows = tweets_to_data(client.fetch_tweet_detail(i, 1))
              except Exception as error:
                  print('post failed', i, error); continue
              t = next((r for r in rows if r.get('id') == i), None)
              if not t: print('post missing', i); continue
              t['savedImages'] = []
              for n, m in enumerate(t.get('media') or []):
                  if m.get('type') != 'photo' or not m.get('url'): continue
                  path = '%s/images/%s-%d.jpg' % (out, i, n + 1)
                  base = m['url'].rsplit('.', 1)[0]
                  for url in (base + '?format=jpg&name=large', m['url'] + '?name=large', m['url']):
                      try:
                          request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Referer': 'https://x.com/'})
                          open(path, 'wb').write(urllib.request.urlopen(request, timeout=30).read())
                          t['savedImages'].append(path); break
                      except Exception as error:
                          print('image failed', url, error)
              found.append(t)
              print(t.get('createdAtISO'), i, len(t['savedImages']), 'pictures', (t.get('text') or '')[:80].replace('\n', ' '))
          json.dump(found, open(out + '/linked-posts.json', 'w'), ensure_ascii=False, indent=1)
          PY
      - name: Commit results to the preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add _originals/king-x
          git commit -m "Collect KING posts from X (one-off)" || exit 0
          git push
