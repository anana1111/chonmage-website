# One-off on the KING preview branch (F approved in the project thread): collect the shop's past
# KING tournament posts (new and old account) and pictures from X so /king/ can show real winners.
# Uses the same burner account as update-events.yml. Delete this file before merging.
name: Fetch KING posts from X (one-off)
on:
  push:
    branches: [claude/project-thread-qyxssn]
    paths: [.github/workflows/king-x-fetch.yml]
permissions:
  contents: write
concurrency: king-x-fetch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read the old account's whole timeline and the KING result pictures
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.X_CT0 }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check twitter-cli==0.8.5
          python3 - <<'PY'
          # The shop moved to @ChonmageNiigata in September 2026; earlier posts are on @Old_Chonmage.
          # twitter-cli stops at 200 posts, so page the old timeline with its own client instead.
          import json, os, re, urllib.request
          from twitter_cli.cli import _get_client
          from twitter_cli.serialization import tweets_to_data
          out = '_originals/king-x'; os.makedirs(out + '/images', exist_ok=True)
          client = _get_client(quiet=True)
          client._max_count = 3000
          user = client.fetch_user('Old_Chonmage')
          tweets = client.fetch_user_tweets(user.id, 3000)
          rows = tweets_to_data(tweets)
          print(len(rows), 'old posts', rows and rows[-1]['createdAtISO'])
          json.dump({'ok': True, 'data': rows}, open(out + '/old-user-posts.json', 'w'), ensure_ascii=False)
          hint = re.compile(r'(?<![A-Za-z])(KING|King|king)(?![A-Za-z])|王者|最強')
          picked = [t for t in rows if hint.search(t.get('text') or '')]
          for t in picked:
              t['savedImages'] = []
              for i, m in enumerate(t.get('media') or []):
                  if m.get('type') != 'photo' or not m.get('url'): continue
                  name = m['url'].rsplit('/', 1)[-1].split('.')[0]
                  path = '%s/images/%s-%d.jpg' % (out, t['id'], i + 1)
                  url = 'https://pbs.twimg.com/media/%s?format=jpg&name=large' % name
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      open(path, 'wb').write(urllib.request.urlopen(request, timeout=30).read())
                      t['savedImages'].append(path)
                  except Exception as error:
                      print('image failed', url, error)
          picked.sort(key=lambda t: t.get('createdAtISO') or '')
          json.dump(picked, open(out + '/king-result-posts.json', 'w'), ensure_ascii=False, indent=1)
          print(len(picked), 'KING posts,', sum(len(t['savedImages']) for t in picked), 'pictures')
          for t in picked: print(t['createdAtISO'], t['id'], (t.get('text') or '')[:60].replace('\n', ' '))
          PY
      - name: Commit results to the preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add _originals/king-x
          git commit -m "Collect KING posts from X (one-off)" || exit 0
          git push
