# One-off on the KING preview branch (F approved in the project thread): collect the shop's past
# KING tournament posts (new and old account) and pictures from X so /king/ can show real winners.
# Uses the same burner account as update-events.yml. Delete this file before merging.
name: Fetch KING posts from X (one-off)
on:
  push:
    branches: [claude/project-thread-qyxssn]
    paths: [.github/workflows/king-x-fetch.yml]
permissions:
  contents: write
concurrency: king-x-fetch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read the old account's posts with twitter-cli
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.X_CT0 }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check twitter-cli==0.8.5
          out=_originals/king-x; mkdir -p "$out"
          # The shop moved to @ChonmageNiigata in September 2026; earlier posts are on @Old_Chonmage.
          twitter user-posts Old_Chonmage --max 1500 --json > "$out/old-user-posts.json" || echo "::warning::old user-posts failed"
          ls -la "$out"
      - name: Download pictures of tournament-result posts
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          out = '_originals/king-x'
          rows = []
          for name in ('user-posts.json', 'old-user-posts.json'):
              try:
                  data = json.load(open(os.path.join(out, name)))
              except Exception as error:
                  print('skip', name, error); continue
              rows += data.get('data') or []
          hint = re.compile(r'(?<![A-Za-z])(KING|King|king)(?![A-Za-z])|王者|最強|決定戦|ランキング戦|優勝|チャンピオン')
          picked = [t for t in rows if hint.search(t.get('text') or '')]
          os.makedirs(out + '/images', exist_ok=True)
          for t in picked:
              t['savedImages'] = []
              for i, m in enumerate(t.get('media') or []):
                  if m.get('type') != 'photo' or not m.get('url'): continue
                  path = '%s/images/%s-%d.jpg' % (out, t['id'], i + 1)
                  if os.path.exists(path): t['savedImages'].append(path); continue
                  url = m['url'] + ('&' if '?' in m['url'] else '?') + 'name=large'
                  try:
                      urllib.request.urlretrieve(url, path); t['savedImages'].append(path)
                  except Exception as error:
                      print('image failed', url, error)
          picked.sort(key=lambda t: t.get('createdAtISO') or '')
          json.dump(picked, open(out + '/result-posts.json', 'w'), ensure_ascii=False, indent=1)
          print(len(rows), 'posts read,', len(picked), 'result posts')
          PY
      - name: Commit results to the preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add _originals/king-x
          git commit -m "Collect KING posts from X (one-off)" || exit 0
          git push
