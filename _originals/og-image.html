<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Archivo+Black&display=block" rel="stylesheet">
<style>
  /* LINE shows only the centre square (x 285–915) as its thumbnail, so all text lives in .tile. */
  :root { --blue:#273870; --orange:#f26b38; --ink:#171816; --soft:#ffb39b; }
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:var(--ink); }
  .card { position:relative; width:1200px; height:630px; font-family:"Noto Sans JP", sans-serif; color:#fff; overflow:hidden; }
  .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 62%; filter:saturate(.85); }
  .wash { position:absolute; inset:0; background:rgba(20,21,19,.22); }
  .band { position:absolute; top:0; bottom:0; left:262px; width:676px; background:var(--blue); box-shadow:0 0 70px rgba(0,0,0,.5); }
  .band::before, .band::after { content:""; position:absolute; top:0; bottom:0; width:8px; background:var(--orange); }
  .band::before { left:0; } .band::after { right:0; }
  .grain { position:absolute; inset:0; opacity:.07; mix-blend-mode:screen;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  .tile { position:absolute; left:285px; top:0; width:630px; height:630px; box-sizing:border-box; padding:42px 44px 40px; }
  .top { display:flex; justify-content:space-between; align-items:center; white-space:nowrap; }
  .top .en { font-family:"Archivo Black", sans-serif; font-size:18px; letter-spacing:.04em; }
  .top .loc { font-size:14px; font-weight:700; letter-spacing:.18em; opacity:.8; }
  h1 { margin:40px 0 0; font-weight:900; font-size:96px; line-height:1.07; letter-spacing:-.04em; white-space:nowrap; }
  h1 span { display:block; }
  h1 .accent { color:var(--soft); }
  .sticker { position:absolute; left:384px; top:92px; width:214px; transform:rotate(8deg); filter:drop-shadow(0 8px 14px rgba(0,0,0,.35)); }
  .foot { position:absolute; left:44px; right:44px; bottom:40px; border-top:2px solid rgba(255,255,255,.45); padding-top:18px;
          display:flex; justify-content:space-between; align-items:baseline; white-space:nowrap; }
  .name { font-size:25px; font-weight:900; letter-spacing:.02em; }
  .url { font-size:17px; font-weight:700; letter-spacing:.03em; opacity:.88; }
</style></head>
<body><div class="card">
  <img class="photo" src="../images/interior-wide.webp" alt="">
  <div class="wash"></div>
  <div class="band"><div class="grain"></div></div>
  <div class="tile">
    <div class="top"><span class="en">POKER ROOM CHONMAGE</span><span class="loc">NIIGATA · FURUMACHI</span></div>
    <h1><span>古町で、</span><span>気軽に</span><span class="accent">ポーカーを。</span></h1>
    <img class="sticker" src="../images/hero-sticker-800.webp" alt="">
    <div class="foot"><span class="name">ポーカールーム ちょんまげ</span><span class="url">chonmagepoker.com</span></div>
  </div>
</div></body></html>
