<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #141513; }
  .card { position: relative; width: 1200px; height: 630px; font-family: "Noto Sans JP", sans-serif; color: #fff; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; }
  .wash { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,21,19,.9), rgba(20,21,19,.74) 30%, rgba(20,21,19,.42) 55%, rgba(20,21,19,.08) 80%), linear-gradient(0deg, rgba(20,21,19,.75), transparent 38%); }
  .copy { position: absolute; left: 72px; top: 64px; }
  .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: .24em; opacity: .92; }
  h1 { margin: 26px 0 0; font-weight: 900; font-size: 104px; line-height: 1.08; letter-spacing: -.01em; text-shadow: 0 4px 30px rgba(0,0,0,.35); }
  h1 span { display: block; }
  .accent { color: #f7a48b; }
  .sticker { position: absolute; left: 470px; top: 120px; width: 190px; transform: rotate(6deg); filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,.45); padding-top: 22px; }
  .name { font-size: 30px; font-weight: 900; letter-spacing: .02em; }
  .url { font-size: 24px; font-weight: 700; letter-spacing: .06em; opacity: .95; }
</style></head>
<body><div class="card">
  <img class="photo" src="../images/interior-wide.webp" alt="">
  <div class="wash"></div>
  <div class="copy">
    <div class="eyebrow">NIIGATA · FURUMACHI 6 · POKER ROOM</div>
    <h1><span>古町で、</span><span>気軽に</span><span class="accent">ポーカーを。</span></h1>
  </div>
  <img class="sticker" src="../images/hero-sticker-800.webp" alt="">
  <div class="foot"><span class="name">ポーカールーム ちょんまげ</span><span class="url">chonmagepoker.com</span></div>
</div></body></html>
